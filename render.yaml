services:
  - type: web
    name: iskcon-nagda-community
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --prefix backend
    startCommand: npm start
    healthCheckPath: /api/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
